; Desk Display — PlatformIO configuration
; Track 0: native unit tests + dial env declaration (no flash required)

[platformio]
default_envs = native
boards_dir = boards

; ─── Host unit tests (no hardware) ───────────────────────────────────────────
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
test_build_src = false
build_flags =
	-std=c++17
	-I${PROJECT_DIR}/test
	-DFIXTURE_DIR=\"${PROJECT_DIR}/fixtures\"
lib_deps =
	bblanchon/ArduinoJson @ ^7
lib_ldf_mode = deep+

; ─── Waveshare ESP32-S3 Knob 1.8 (Dial) ──────────────────────────────────────
; Board JSON: boards/waveshare_knob_18.json (N16R8 — 16MB flash, 8MB PSRAM)
; Reference: https://github.com/IngoDuesentrieb/esp32-s3-knob-hardware-explorer
[env:dial]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = waveshare_knob_18

build_flags =
	-DCORE_DEBUG_LEVEL=3
	-DLV_CONF_INCLUDE_SIMPLE
	-I include
	-DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; Flip USB-C if upload sees ESP32 instead of ESP32-S3
monitor_port = /dev/cu.usbmodem*
upload_speed = 115200

lib_deps =
	lvgl/lvgl @ ^8.4.0
	bblanchon/ArduinoJson @ ^7.3.0
